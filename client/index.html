<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        />
        <title>WebLink</title>
        <script>
            // Applies the theme before React loads, so the page never flashes the wrong one.
            // Same rule as ThemeProvider: saved choice first, otherwise the system setting.
            (function () {
                try {
                    var saved = localStorage.getItem("weblink.theme");
                    var dark = matchMedia("(prefers-color-scheme: dark)").matches;
                    document.documentElement.dataset.theme =
                        saved === "light" || saved === "dark" ? saved : dark ? "dark" : "light";
                } catch (error) {
                    document.documentElement.dataset.theme = "light";
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
